services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: examtrust
      MYSQL_USER: examtrust
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:3001:3001"
    # Lịch sử migrations không đầy đủ (nhiều bảng chưa từng được tạo qua migration
    # file, chỉ tồn tại do drift trên DB dev cũ) nên "migrate deploy" luôn fail.
    # Schema đã được khởi tạo 1 lần bằng "prisma db push" (xem AWS_DEPLOY_NOTES.txt).
    command: node dist/main.js

  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: node dist/ai-worker.js

volumes:
  mysql-data:
  redis-data:
