name: Deploy BE

on:
  workflow_dispatch:

env:
  EC2_HOST: 32.236.182.208
  EC2_USER: ubuntu
  EC2_DIR: ~/examtrust-be

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add EC2 host to known_hosts
        run: ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Write latest .env.production from secret
        run: |
          cat > /tmp/env.production <<'ENV_EOF'
          ${{ secrets.BE_ENV_PRODUCTION }}
          ENV_EOF

      - name: Sync BE code to EC2 (code only, env handled separately)
        run: |
          rsync -avz \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'dist' \
            --exclude '.env' \
            --exclude '.env.production' \
            -e "ssh -o StrictHostKeyChecking=no" \
            BE/ ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.EC2_DIR }}/

      - name: Sync .env.production to EC2
        run: |
          scp -o StrictHostKeyChecking=no /tmp/env.production \
            ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.EC2_DIR }}/.env.production

      - name: Rebuild and restart BE containers
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "
            cd ${{ env.EC2_DIR }} &&
            docker compose -f docker-compose.prod.yml build app ai-worker &&
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d
          "
